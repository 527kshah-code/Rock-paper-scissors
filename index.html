<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header class="text-center py-4">
            <div>
                <h1>Rock Paper Scissors Game</h1>
            </div>
            <p>This is a rock paper scissors game, please pick one or the option to play against the computer.</p>
        </header>
        <main>
            <!--Character choosing section pt. 1-->
            <section class="container text-center my-4">
                <h2 class="mb-3">Choose a character</h2>
                <div class="row justify-content-center">
                    <div class="col-6 col-md-4 mb-3 card character-card" data-index="0">
                        <img src="gojo.jpg" alt="image of Gojo">
                        <div class="text-center p-3">Satoru Gojo</div>
                    </div>
                    <div class="col-6 col-md-4 mb-3 card character-card" data-index="1">
                        <img src="yuji.jpg" alt="image of Yuji">
                        <div class="text-center p-3">Yuji</div>
                    </div>
                    <div class="col-6 col-md-4 mb-3 card character-card" data-index="2">
                        <img src="toge.jpg" alt="image of Toge">
                        <div class="text-center p-3">Toge</div>
                    </div>
                    <div class="col-6 col-md-4 mb-3 card character-card" data-index="3">
                        <img src="megumi.jpg" alt="image of Megumi">
                        <div class="text-center p-3">Megumi</div>
                    </div>
                    <div class="col-6 col-md-4 mb-3 card character-card" data-index="4">
                        <img src="jogo.jpg" alt="image of Jogo">
                        <div class="text-center p-3">Jogo</div>
                    </div>
                </div>
            </section>
            <!-- Vs. section pt.2 of website -->
             <section class="container text-center my-4">
                <div class="vs mb-2">VS.</div>
                <div class="row justify-content-center">
                    <div class="col-8 col-md-4">
                        <div class="card card-custom sukuna p-3">Sukuna</div>
                    </div>
             </section>
             <!--rock-paper scissors buttons-->
             <section class="container text-center my-4">
                <h2 class="mb-3">Make your move</h2>
                <div class="d-flex justify-content-center gap-3"></div>
                    <button class="btn choice-btn rock">🪨</button>
                    <button class="btn choice-btn paper">📄</button>
                    <button class="btn choice-btn scissors">✂️</button>
                </div>
             </section>
        </main>
        <footer class="text-center">
            <p>| © 2026 Rock Paper Scissors Game • Kavya Shah • Web 2 |</p>
        </footer>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
